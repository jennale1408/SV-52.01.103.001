<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noel Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header-grid-container">
        <div class="logo-container">
            <img class="logo" src="logorm.png" alt="Noel Store Logo">
            <h1>Noel Store</h1>
        </div>


        <div class="search-container">
            <input class="search-input" type="text">
            <button class="search-button">Search</button>
        </div>


        <div class="cart-account-container">
            <button class="cart-button">Giỏ hàng</button>
            <button class="account-button">Tài khoản</button>
        </div>
    </header>
    <div class="category-container">
        <div class="category-item-container">
            <img class="category-item-img" src="Decoration.png">
            <p class="category-item-name">Decoration</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Dessert.png">
            <p class="category-item-name">Dessert</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Clothes.png">
            <p class="category-item-name">Clothes</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Chococup.png">
            <p class="category-item-name">Hot chocolate</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Tree.png">
            <p class="category-item-name">Tree</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Star.png">
            <p class="category-item-name">Star</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Ball.png">
            <p class="category-item-name">Ball</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Hat.png">
            <p class="category-item-name">Santa Hat</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="sock.png">
            <p class="category-item-name">Sock</p>
        </div>
        <div class="category-item-container">
            <img class="category-item-img" src="Candycane.png">
            <p class="category-item-name">Candycane</p>
        </div>


    </div>

    <div class="all-product-container">
        <div class="item-product-container">
            <img class="product-img" src="ginger.jpg">
            <h1 class="product-title"> ginger bread</h1>
            <p class="product-price">50$</p>
        </div>

        <div class="item-product-container">
            <img class="product-img" src="xmascup.jpg">
            <h1 class="product-title"> Xmas cup</h1>
            <p class="product-price">70$</p>
        </div>
        <div class="item-product-container">
            <img class="product-img" src="ball.jpg">
            <h1 class="product-title"> Xmas ball</h1>
            <p class="product-price">10$</p>
        </div>
        <div class="item-product-container">
            <img class="product-img" src="noelcake.jpg">
            <h1 class="product-title"> Wood Cake</h1>
            <p class="product-price">80$</p>
        </div>
        

    </div>
</body>

</html>
